name: HealthBridge
options:
  bundleIdPrefix: app.yiliang
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  HealthBridge:
    type: application
    platform: iOS
    sources: [HealthBridge]
    info:
      path: HealthBridge/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.yiliang.healthbridge.connect
            CFBundleURLSchemes: [healthbridge]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.yiliang.healthbridge
        INFOPLIST_KEY_CFBundleDisplayName: HealthBridge
        INFOPLIST_KEY_NSCameraUsageDescription: '扫描你的服务器连接码。'
        INFOPLIST_KEY_NSHealthShareUsageDescription: '读取你选择的健康数据，在本机显示概览；仅在你明确同意后，将数据同步到你自己的服务器，供你连接的 AI Agent 查询。'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: HealthBridge/HealthBridge.entitlements
    scheme:
      testTargets: [HealthBridgeTests, HealthBridgeUITests]
  HealthBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HealthBridgeTests]
    dependencies:
      - target: HealthBridge
  HealthBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HealthBridgeUITests]
    dependencies:
      - target: HealthBridge
